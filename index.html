<!DOCTYPE html>
<!--
念风chat · 本地优先、插件化的 AI 聊天客户端（cordis v4 内核 + Node 本地后端）
项目全称：念风 Chat（NianFeng-Chat）
仓库：https://github.com/nianfeng233/NianFeng-Chat
-->
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>念风chat</title>
  <link rel="icon" id="appFavicon" href="./public/assets/logo.png" />
  <script type="module">
    // 全项目统一头像 / 品牌 logo 入口：换资源只改 src/util/identity.mjs 的 BRAND_LOGO。
    import { BRAND_LOGO } from './src/util/identity.mjs'
    const favicon = document.getElementById('appFavicon')
    if (favicon) favicon.href = BRAND_LOGO
  </script>
  <!-- 真实的 cordis 内核：浏览器端通过 import map 解析裸模块名 -->
  <script type="importmap">
    {
      "imports": {
        "cordis": "./node_modules/cordis/lib/index.js",
        "cosmokit": "./node_modules/cosmokit/lib/index.mjs"
      }
    }
  </script>
  <style>
    /* 启动前的极简兜底样式；应用启动后由 theme-tokens 插件接管全部视觉 */
    html, body { height: 100%; margin: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      background: #fff; color: #1a1d21;
    }
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      transition: opacity .3s ease;
    }
    #boot .mark {
      width: 56px; height: 56px; border-radius: 16px;
      background: linear-gradient(135deg, #edf7e7, #d9efcb);
      display: flex; align-items: center; justify-content: center;
      color: #70a15a; font-size: 24px; font-weight: 700;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.9);
      animation: breathe 1.6s ease-in-out infinite;
    }
    #boot .tip { font-size: 12.5px; color: #8b919c; text-align: center; line-height: 1.7; padding: 0 24px; }
    #boot .bar { width: 180px; height: 3px; border-radius: 2px; background: rgba(0,0,0,.06); overflow: hidden; }
    #boot .bar i { display: block; width: 40%; height: 100%; border-radius: 2px; background: #b8e496; animation: slide 1.1s ease-in-out infinite; }
    #boot .spinner {
      display: none; width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid rgba(112,161,90,.22); border-top-color: #70a15a;
      animation: spin .85s linear infinite;
    }
    #boot.maintenance .mark, #boot.maintenance .bar { display: none; }
    #boot.maintenance .spinner { display: block; }
    @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    #boot.fade { opacity: 0; pointer-events: none; }
    #fatal { display: none; position: fixed; inset: 0; padding: 40px; background: #fff; z-index: 9999; overflow: auto; }
    #fatal.show { display: block; }
    #fatal h2 { color: #c65b5b; font-size: 16px; }
    #fatal pre { font-size: 12px; line-height: 1.6; white-space: pre-wrap; color: #5c6370; }
  </style>
</head>
<body>
  <!-- 内核挂载点：整个界面由插件在运行时构建 -->
  <div id="app"></div>

  <div id="boot">
    <div class="mark">念</div>
    <div class="spinner"></div>
    <div class="tip" id="bootTip">正在加载插件…</div>
    <div class="bar"><i></i></div>
  </div>

  <div id="fatal">
    <h2>启动失败</h2>
    <p class="tip" id="fatalTip"></p>
    <pre id="fatalStack"></pre>
  </div>

  <script type="module">
    const MAINTENANCE_KEY = 'nianfeng:maintenance'
    const MAINTENANCE_MAX_AGE = 30 * 60 * 1000

    function readMaintenance() {
      try {
        const info = JSON.parse(localStorage.getItem(MAINTENANCE_KEY) || 'null')
        if (!info || typeof info !== 'object') return null
        if (Date.now() - Number(info.at || 0) > MAINTENANCE_MAX_AGE) {
          localStorage.removeItem(MAINTENANCE_KEY)
          return null
        }
        return info
      } catch (_) {
        localStorage.removeItem(MAINTENANCE_KEY)
        return null
      }
    }

    function normalBoot() {
      import('./src/main.mjs')
        .then(({ boot }) => boot({ scope: 'webui' }))
        .catch(err => {
          console.error('[nianfeng] boot failed', err)
          document.getElementById('boot')?.classList.add('fade')
          document.getElementById('fatalTip').textContent = String(err?.message || err)
          document.getElementById('fatalStack').textContent = String(err?.stack || '')
          document.getElementById('fatal').classList.add('show')
        })
    }

    function maintenanceBoot(info) {
      const bootEl = document.getElementById('boot')
      bootEl?.classList.add('maintenance')
      const tip = document.getElementById('bootTip')
      if (tip) {
        tip.textContent =
          info?.type === 'update'
            ? '正在更新念风，当前项目已完全关闭；更新完成后会自动加载新版本…'
            : '正在重启念风；服务恢复后会自动加载…'
      }

      let sawOffline = false
      const startedAt = Date.now()
      const tick = async () => {
        if (Date.now() - startedAt > MAINTENANCE_MAX_AGE) return
        const age = Date.now() - Number(info?.at || startedAt)
        try {
          const response = await fetch(`/api/health?ts=${Date.now()}`, {
            cache: 'no-store',
            signal: typeof AbortSignal !== 'undefined' && typeof AbortSignal.timeout === 'function' ? AbortSignal.timeout(4000) : undefined,
          })
          if (response.ok) {
            // 桌面版新窗口只会在更新 / 重启完成后出现；Web 版则至少看到一次旧服务离线，
            // 或者维护标记已经足够旧，才开始恢复，避免抢在旧后端退出前重新进入界面。
            if (info?.kind === 'desktop' || sawOffline || age > 8000) {
              try {
                localStorage.removeItem(MAINTENANCE_KEY)
              } catch (_) {
                /* ignore */
              }
              location.reload()
              return
            }
          } else {
            sawOffline = true
          }
        } catch (_) {
          sawOffline = true
        }
        setTimeout(tick, 1500)
      }
      setTimeout(tick, 1200)
    }

    const maintenance = readMaintenance()
    if (maintenance) maintenanceBoot(maintenance)
    else normalBoot()
  </script>
</body>
</html>
