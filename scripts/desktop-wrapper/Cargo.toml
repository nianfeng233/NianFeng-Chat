# 念风chat · 本地优先、插件化的 AI 聊天客户端（cordis v4 内核 + Node 本地后端）
# 项目全称：念风 Chat（NianFeng-Chat）
# 仓库：https://github.com/nianfeng233/NianFeng-Chat
[package]
name = "nianfeng-desktop"
version = "2.2.0-preview.4"
edition = "2021"
description = "念风Chat 无边框桌面壳（WebView2）"
license = "Apache-2.0"

[dependencies]
tao = "0.34.8"
wry = "0.53.5"

# Windows 系统通知：Shell_NotifyIcon（托盘气泡 / 操作中心）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
