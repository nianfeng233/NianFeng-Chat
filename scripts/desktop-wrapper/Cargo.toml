[package]
name = "fengyu-desktop"
version = "0.40.0"
edition = "2021"
description = "风语 AI Chat 无边框桌面壳（WebView2）"
license = "MIT"

[dependencies]
tao = "0.34.8"
wry = "0.53.5"

# Windows 系统通知：Shell_NotifyIcon（托盘气泡 / 操作中心）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
